name: wolverine-cron

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run pipeline
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: npm run scrape

      - name: Self-heal on failure
        if: failure()
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: npm run heal

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolverine-run
          path: |
            db/*.sqlite
            heal-log.md
          if-no-files-found: warn
