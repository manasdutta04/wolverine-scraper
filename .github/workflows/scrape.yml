name: wolverine-scrape

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Store id to inject cloned-price fixture (e.g. sparkfun). Leave blank for a real scrape.
        required: false
        type: string
        default: ""

concurrency:
  group: wolverine-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Bright Data CLI login
        run: npx --yes @brightdata/cli login --api-key "$BRIGHTDATA_API_KEY"

      - name: Scrape all stores
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.simulate_failure == '' }}
        run: npm run scrape

      - name: Simulated red-flag + heal trigger
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate_failure != '' }}
        run: npm run heal -- --simulate-failure=${{ github.event.inputs.simulate_failure }}

      - name: Red-flag check (heal + approve + re-run if needed)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.simulate_failure == '' }}
        run: npm run heal

      - name: Export Scar Feed snapshot
        if: always()
        run: npm run scar:export

      - name: Upload SQLite snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolverine-db
          path: |
            db/wolverine.db
            heal-log.md
            web/public/data/scar.json
          if-no-files-found: warn

      - name: Commit scar feed snapshot if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heal-log.md web/public/data/scar.json
          if git diff --staged --quiet; then
            echo "scar feed snapshot unchanged"
          else
            git commit -m "ci: refresh scar feed snapshot"
            git push
          fi
