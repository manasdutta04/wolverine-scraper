services:
  web:
    build: .
    image: manasdutta04/wolverine-dashboard:latest
    ports:
      - "3000:3000"
    environment:
      WOLVERINE_DB: /data/wolverine.db
      WOLVERINE_HEAL_LOG: /data/heal-log.md
    # Optional: override bundled snapshot with a fresh local scrape
    # volumes:
    #   - ./db/wolverine.db:/data/wolverine.db:ro
    #   - ./heal-log.md:/data/heal-log.md:ro
